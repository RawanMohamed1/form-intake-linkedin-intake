<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with Marlow & Finch</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
      color: #1a1a1a;
      background: #fff;
    }
    h1 { font-size: 1.3rem; margin-bottom: 4px; }
    p.sub { color: #666; margin-top: 0; margin-bottom: 20px; font-size: 0.9rem; }
    #chatWindow {
      border: 1px solid #ddd;
      border-radius: 10px;
      height: 420px;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafafa;
    }
    .bubble {
      max-width: 80%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.35;
    }
    .bot { align-self: flex-start; background: #e9e9eb; color: #1a1a1a; border-bottom-left-radius: 4px; }
    .user { align-self: flex-end; background: #1a1a1a; color: #fff; border-bottom-right-radius: 4px; }
    .typing { align-self: flex-start; color: #888; font-size: 0.85rem; font-style: italic; }
    #inputRow { display: flex; gap: 8px; margin-top: 12px; }
    #msgInput {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }
    button {
      padding: 10px 16px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }

    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #eee; }
      p.sub { color: #999; }
      #chatWindow { background: #1a1a1a; border-color: #333; }
      .bot { background: #2a2a2a; color: #eee; }
      #msgInput { background: #1e1e1e; color: #eee; border-color: #444; }
      button { background: #eee; color: #121212; }
    }
  </style>
</head>
<body>
  <h1>Chat with Marlow &amp; Finch</h1>
  <p class="sub">Tell us what you need — think of this like messaging us on LinkedIn.</p>

  <div id="chatWindow"></div>
  <div id="inputRow">
    <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const WORKER_URL = "https://marlow-finch-chat-proxy.rawanessam772.workers.dev";

    const chatWindow = document.getElementById('chatWindow');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    let history = [];
    let turns = 0;
    const MAX_TURNS = 5;

    function addBubble(text, role) {
      const div = document.createElement('div');
      div.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');
      div.textContent = text;
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typingIndicator';
      div.textContent = 'Marlow & Finch is typing...';
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || turns >= MAX_TURNS) return;

      addBubble(text, 'user');
      history.push({ role: 'user', content: text });
      msgInput.value = '';
      sendBtn.disabled = true;
      addTyping();

      try {
        const res = await fetch(WORKER_URL + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        removeTyping();
        addBubble(data.reply, 'bot');
        history.push({ role: 'assistant', content: data.reply });
        turns++;

        if (turns >= MAX_TURNS) {
          await submitConversation();
        }
      } catch (err) {
        removeTyping();
        addBubble("Sorry, something went wrong. A consultant will follow up by email.", 'bot');
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function submitConversation() {
      const transcript = history
        .filter(m => m.role === 'user')
        .map(m => m.content)
        .join(' | ');

      await fetch(WORKER_URL + '/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ raw_text: transcript })
      });

      msgInput.disabled = true;
      sendBtn.disabled = true;
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    addBubble("Hi! Are you looking to hire, or enquiring about something else? Tell me a bit about what you need.", 'bot');
  </script>
</body>
</html>
