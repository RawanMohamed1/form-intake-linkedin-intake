<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Marlow & Finch</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 50px auto;
      padding: 0 20px 60px;
      color: #1a1a1a;
      background: #fff;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    h2 { font-size: 1.1rem; margin-top: 0; }
    p.sub { color: #666; margin-top: 0; margin-bottom: 24px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; margin-top: 18px; font-size: 0.9rem; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 16px; font-size: 0.9rem; }
    #status.ok { color: #1a7a3a; }
    #status.err { color: #b3261e; }

    hr.divider { border: none; border-top: 1px solid #ddd; margin: 48px 0 32px; }

    #chatWindow {
      border: 1px solid #ddd;
      border-radius: 10px;
      height: 380px;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafafa;
    }
    .bubble {
      max-width: 80%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.35;
    }
    .bot { align-self: flex-start; background: #e9e9eb; color: #1a1a1a; border-bottom-left-radius: 4px; }
    .user { align-self: flex-end; background: #1a1a1a; color: #fff; border-bottom-right-radius: 4px; }
    .typing { align-self: flex-start; color: #888; font-size: 0.85rem; font-style: italic; }
    #chatInputRow { display: flex; gap: 8px; margin-top: 12px; }
    #msgInput {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }
    #sendBtn {
      margin-top: 0;
      width: auto;
      padding: 10px 16px;
      border-radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #eee; }
      p.sub { color: #999; }
      input, textarea { background: #1e1e1e; color: #eee; border-color: #444; }
      button { background: #eee; color: #121212; }
      hr.divider { border-top-color: #333; }
      #chatWindow { background: #1a1a1a; border-color: #333; }
      .bot { background: #2a2a2a; color: #eee; }
      #msgInput { background: #1e1e1e; color: #eee; border-color: #444; }
    }
  </style>
</head>
<body>
  <h1>Contact Marlow &amp; Finch</h1>
  <p class="sub">Tell us what you're looking for and a consultant will get back to you — fill in the form, or chat with us below.</p>

  <form id="enquiryForm">
    <label for="name">Name</label>
    <input id="name" type="text" placeholder="Your name">

    <label for="company">Company</label>
    <input id="company" type="text" placeholder="Your company (optional)">

    <label for="message">Message</label>
    <textarea id="message" placeholder="What do you need help with?" required></textarea>

    <button type="submit" id="submitBtn">Submit enquiry</button>
    <div id="status"></div>
  </form>

  <hr class="divider">

  <h2>Or chat with us</h2>
  <p class="sub">Think of this like messaging us on LinkedIn.</p>
  <div id="chatWindow"></div>
  <div id="chatInputRow">
    <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

  <script>
    // ---- Web form: posts straight to the n8n webhook ----
    const WEBHOOK_URL = "https://bigmind.trevorsadd.co.uk/webhook/1562e4c6-cc21-4635-810a-3f77e8641648";

    const form = document.getElementById('enquiryForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.textContent = '';
      statusEl.className = '';

      const payload = {
        source: 'webform',
        name: document.getElementById('name').value,
        company: document.getElementById('company').value,
        raw_text: document.getElementById('message').value
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        statusEl.textContent = 'Thanks — your enquiry has been logged.';
        statusEl.className = 'ok';
        form.reset();
      } catch (err) {
        statusEl.textContent = 'Something went wrong, please try again.';
        statusEl.className = 'err';
      } finally {
        submitBtn.disabled = false;
      }
    });

    // ---- Chat widget: talks to the Cloudflare Worker (Claude/OpenRouter proxy) ----
    const WORKER_URL = "https://marlow-finch-chat-proxy.rawanessam772.workers.dev";

    const chatWindow = document.getElementById('chatWindow');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    let history = [];
    let turns = 0;
    const MAX_TURNS = 5;

    function addBubble(text, role) {
      const div = document.createElement('div');
      div.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');
      div.textContent = text;
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typingIndicator';
      div.textContent = 'Marlow & Finch is typing...';
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || turns >= MAX_TURNS) return;

      addBubble(text, 'user');
      history.push({ role: 'user', content: text });
      msgInput.value = '';
      sendBtn.disabled = true;
      addTyping();

      try {
        const res = await fetch(WORKER_URL + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        removeTyping();
        addBubble(data.reply, 'bot');
        history.push({ role: 'assistant', content: data.reply });
        turns++;

        if (turns >= MAX_TURNS) {
          await submitConversation();
        }
      } catch (err) {
        removeTyping();
        addBubble("Sorry, something went wrong. A consultant will follow up by email.", 'bot');
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function submitConversation() {
      const transcript = history
        .filter(m => m.role === 'user')
        .map(m => m.content)
        .join(' | ');

      await fetch(WORKER_URL + '/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ raw_text: transcript })
      });

      msgInput.disabled = true;
      sendBtn.disabled = true;
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    addBubble("Hi! Are you looking to hire, or enquiring about something else? Tell me a bit about what you need.", 'bot');
  </script>
</body>
</html>
