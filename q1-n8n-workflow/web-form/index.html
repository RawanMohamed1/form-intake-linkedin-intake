<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Marlow & Finch</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 20px;
      color: #1a1a1a;
      background: #fff;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p.sub { color: #666; margin-top: 0; margin-bottom: 28px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; margin-top: 18px; font-size: 0.9rem; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 16px; font-size: 0.9rem; }
    #status.ok { color: #1a7a3a; }
    #status.err { color: #b3261e; }

    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #eee; }
      p.sub { color: #999; }
      input, textarea { background: #1e1e1e; color: #eee; border-color: #444; }
      button { background: #eee; color: #121212; }
    }
  </style>
</head>
<body>
  <h1>Contact Marlow &amp; Finch</h1>
  <p class="sub">Tell us what you're looking for and a consultant will get back to you.</p>

  <form id="enquiryForm">
    <label for="name">Name</label>
    <input id="name" type="text" placeholder="Your name">

    <label for="company">Company</label>
    <input id="company" type="text" placeholder="Your company (optional)">

    <label for="message">Message</label>
    <textarea id="message" placeholder="What do you need help with?" required></textarea>

    <button type="submit" id="submitBtn">Submit enquiry</button>
    <div id="status"></div>
  </form>

  <script>
    // Set this to your n8n webhook URL once the Webhook node is created,
    // e.g. https://your-n8n-host/webhook/webform-intake
    const WEBHOOK_URL = "https://bigmind.trevorsadd.co.uk/webhook/1562e4c6-cc21-4635-810a-3f77e8641648";

    const form = document.getElementById('enquiryForm');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      statusEl.textContent = '';
      statusEl.className = '';

      const payload = {
        source: 'webform',
        name: document.getElementById('name').value,
        company: document.getElementById('company').value,
        raw_text: document.getElementById('message').value
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        statusEl.textContent = 'Thanks — your enquiry has been logged.';
        statusEl.className = 'ok';
        form.reset();
      } catch (err) {
        statusEl.textContent = 'Something went wrong, please try again.';
        statusEl.className = 'err';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
